<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة المركزية والفروع | صيدليات الإكسير - Elixir Pharmacies HQ & Branch Console</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Cairo & Inter Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Cairo', 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased">

  <!-- ==================== MANDATORY AUTHENTICATION LOGIN WALL ==================== -->
  <div id="admin-login-wall" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 text-white shadow-2xl relative overflow-hidden">
      <div class="absolute -top-24 -right-24 w-48 h-48 bg-purple-600/30 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-emerald-600/20 rounded-full blur-3xl pointer-events-none"></div>

      <!-- Header & Brand -->
      <div class="text-center mb-6 relative z-10">
        <div class="inline-flex p-3 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-600 shadow-xl mb-3">
          <i data-lucide="shield-check" class="w-8 h-8 text-white"></i>
        </div>
        <h2 class="text-xl font-black tracking-tight text-white">صيدليات الإكسير</h2>
        <p class="text-xs text-purple-300 font-bold mt-1">بوابة تسجيل دخول المدير العام ومديري الفروع</p>
        <p class="text-[11px] text-slate-400 mt-1 leading-relaxed">
          يرجى إدخال اسم المستخدم وكلمة المرور للدخول للوحة الإدارة حسب الصلاحية المعتمدة
        </p>
      </div>

      <!-- Error Box -->
      <div id="login-error-box" class="hidden mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-2">
        <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 text-rose-400"></i>
        <span id="login-error-text">اسم المستخدم أو كلمة المرور غير صحيحة!</span>
      </div>

      <!-- Login Form -->
      <form onsubmit="handleAdminLogin(event)" class="space-y-4 relative z-10 text-xs">
        <div>
          <label class="block text-slate-300 font-bold mb-1.5">اسم المستخدم (Username):</label>
          <div class="relative">
            <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute start-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            <input type="text" id="login-username" required placeholder="مثال: admin أو manager_maadi" class="w-full bg-slate-800 border border-slate-700 rounded-xl py-2.5 ps-9 pe-3 text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 transition">
          </div>
        </div>

        <div>
          <label class="block text-slate-300 font-bold mb-1.5">كلمة المرور (Password):</label>
          <div class="relative">
            <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute start-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-slate-800 border border-slate-700 rounded-xl py-2.5 ps-9 pe-3 text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 transition">
          </div>
        </div>

        <button type="submit" class="w-full py-3 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-black text-sm rounded-xl shadow-lg transition duration-150 flex items-center justify-center gap-2 cursor-pointer mt-2">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          <span>تسجيل الدخول للمنظومة</span>
        </button>
      </form>

      <!-- Quick Demo Shortcuts -->
      <div class="mt-6 pt-5 border-t border-slate-800 relative z-10">
        <div class="text-[11px] font-bold text-slate-400 text-center mb-2.5">تجربة سريعة بالحسابات المعتمدة:</div>
        <div class="grid grid-cols-2 gap-2 text-[10px]">
          <button type="button" onclick="fillAdminLogin('admin', '123')" class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-start transition cursor-pointer">
            <div class="font-black text-purple-300">المدير العام (HQ)</div>
            <div class="text-slate-400 font-mono">admin / 123</div>
          </button>
          <button type="button" onclick="fillAdminLogin('manager_maadi', '123')" class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-start transition cursor-pointer">
            <div class="font-black text-emerald-300">مدير فرع المعادي</div>
            <div class="text-slate-400 font-mono">manager_maadi / 123</div>
          </button>
          <button type="button" onclick="fillAdminLogin('manager_thakanat', '123')" class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-start transition cursor-pointer">
            <div class="font-black text-blue-300">مدير فرع ثكنات المعادي</div>
            <div class="text-slate-400 font-mono">manager_thakanat / 123</div>
          </button>
          <button type="button" onclick="fillAdminLogin('manager_degla', '123')" class="p-2 rounded-xl bg-slate-800/80 hover:bg-slate-700 border border-slate-700 text-start transition cursor-pointer">
            <div class="font-black text-amber-300">مدير فرع دجلة</div>
            <div class="text-slate-400 font-mono">manager_degla / 123</div>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Header and Main Consoles rendered upon successful authentication -->
  <!-- ... (كامل الميزات الموضحة سابقاً) ... -->
</body>
</html>
